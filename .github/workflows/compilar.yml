name: Compilar

on:
  push:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que la app compila para iPad
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          cd Cuaderno.swiftpm
          xcrun swiftc -typecheck -parse-as-library \
            -sdk "$SDK" -target arm64-apple-ios17.5-simulator \
            $(ls *.swift | grep -v Package.swift)
      - name: Compilar el paquete completo (informativo)
        continue-on-error: true
        run: |
          cd Cuaderno.swiftpm
          set -o pipefail
          xcodebuild -scheme Cuaderno -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -40
